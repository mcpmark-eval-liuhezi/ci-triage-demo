name: CI

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Produce build report
        run: |
          mkdir -p build
          {
            echo "build report"
            echo "run_id: ${GITHUB_RUN_ID}"
            echo "run_number: ${GITHUB_RUN_NUMBER}"
            echo "sha: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF}"
            echo "tests_planned: 1"
          } > build/report.txt
          cat build/report.txt

      - name: Upload build report artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build/report.txt

      - name: Run test suite
        run: |
          echo "== test_checkout.py =="
          echo "test_checkout_screens      ... ok"
          echo "test_checkout_cart          ... ok"
          echo "test_checkout_retries      ... attempt 1 FAILED (timeout after 30s)"
          echo "test_checkout_retries      ... attempt 2 FAILED (timeout after 30s)"
          echo "test_checkout_retries      ... attempt 3 FAILED (timeout after 30s)"
          echo "ERROR: test_checkout_retries failed after 3 attempts" >&2
          exit 1
